services:

  dashboard:
    build: .
    container_name: retail-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
    command: streamlit run src/dashboard.py --server.address=0.0.0.0

  minio:
    image: minio/minio
    container_name: retail-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"